# Host fixé (sinon OpenShift génère <route>-<namespace>.apps…). Doit être identique à ORIGIN (configmap.yaml).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jingle-quest
  labels: { app: jingle-quest }
  annotations:
    # Connexions SSE longues (/api/events) : sans ça le routeur HAProxy les coupe à 30 s.
    # Un heartbeat part toutes les 25 s côté serveur (SPECS §7.4).
    haproxy.router.openshift.io/timeout: 1h
spec:
  host: jingle-quest.apps.ocp4.innershift.sodigital.io
  to:
    kind: Service
    name: jingle-quest
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
