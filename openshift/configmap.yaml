# Configuration non sensible et identique d'un déploiement à l'autre (réappliquée par la CI).
# Ce qui est propre à l'entreprise (ADMIN_EMAILS, ALLOWED_EMAIL_DOMAINS) vit dans le secret
# jingle-quest-secrets, que la CI ne touche jamais : voir secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jingle-quest-config
  labels: { app: jingle-quest }
data:
  # Même host que route.yaml. Redirect URI à déclarer chez l'IdP : <ORIGIN>/auth/callback
  ORIGIN: 'https://jingle-quest.apps.ocp4.innershift.sodigital.io'
