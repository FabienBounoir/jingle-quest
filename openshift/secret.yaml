# MODÈLE — ne jamais committer de vraies valeurs, ne pas appliquer ce fichier. Créer le secret avec :
#   oc create secret generic jingle-quest-secrets \
#     --from-literal=DATABASE_URL='postgres://jq:<mot-de-passe>@jingle-quest-db:5432/jq' \
#     --from-literal=OIDC_ISSUER_URL='https://login.microsoftonline.com/<tenant-id>/v2.0' \
#     --from-literal=OIDC_CLIENT_ID='...' \
#     --from-literal=OIDC_CLIENT_SECRET='...' \
#     --from-literal=VAPID_PUBLIC='...' --from-literal=VAPID_PRIVATE='...' \
#     --from-literal=ADMIN_EMAILS='a@x.com' --from-literal=ALLOWED_EMAIL_DOMAINS=''
# (ou plus simple : sh openshift/secrets.sh)
# Clés VAPID (optionnelles, notifications push) : npx web-push generate-vapid-keys
# Redirect URI à déclarer chez l'IdP : https://<host de la route>/auth/callback
apiVersion: v1
kind: Secret
metadata:
  name: jingle-quest-secrets
  labels: { app: jingle-quest }
type: Opaque
stringData:
  DATABASE_URL: 'postgres://jq:CHANGEME@jingle-quest-db:5432/jq'
  OIDC_ISSUER_URL: 'CHANGEME'
  OIDC_CLIENT_ID: 'CHANGEME'
  OIDC_CLIENT_SECRET: 'CHANGEME'
  VAPID_PUBLIC: ''
  VAPID_PRIVATE: ''
  ADMIN_EMAILS: 'CHANGEME@exemple.com'
  ALLOWED_EMAIL_DOMAINS: ''
