apiVersion: apps/v1
kind: Deployment
metadata:
  name: jingle-quest
  labels: { app: jingle-quest }
  annotations:
    # Redéploie à chaque nouvelle image construite par le BuildConfig.
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"jingle-quest:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
spec:
  # UN seul replica : l'état temps réel (SSE, classement) vit en mémoire du pod (SPECS §5.2, §7.4).
  # Recreate : jamais deux pods en même temps (migrations au boot, état mémoire unique).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: jingle-quest }
  template:
    metadata:
      labels: { app: jingle-quest }
    spec:
      containers:
        - name: app
          image: jingle-quest:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef: { name: jingle-quest-config }
            - secretRef: { name: jingle-quest-secrets }
          # Couvre migrate.js au boot avant l'ouverture du port.
          startupProbe:
            httpGet: { path: /healthz, port: 3000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 1500m, memory: 1Gi }
