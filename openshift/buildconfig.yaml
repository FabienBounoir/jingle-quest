# Construit l'image depuis le miroir GitLab innersource du dépôt GitHub. La CI remplace
# CHANGEME-git-uri par $GIT_SOURCE_URI et lance `oc start-build --commit=<sha>`.
# Miroir lisible sans authentification : pas de sourceSecret (à ajouter si le dépôt devient privé).
# Dépannage depuis un poste : oc start-build jingle-quest --from-repo=. --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jingle-quest
  labels: { app: jingle-quest }
spec:
  source:
    type: Git
    git:
      uri: CHANGEME-git-uri
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  # Sans ce bloc, le pod de build hérite du défaut du namespace et rampe pendant npm ci / vite build.
  # 1000m : app (1500m) + db (1000m) + build (1000m) = 3,5 cœurs, sous le quota de 4.
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { cpu: 1000m, memory: 1536Mi }
  output:
    to:
      kind: ImageStreamTag
      name: jingle-quest:latest
