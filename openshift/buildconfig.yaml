# Build « binaire » : le contenu est envoyé depuis le poste (ou la CI) au lancement, sans que le
# cluster ait à lire le dépôt GitHub (privé). Envoie exactement le dernier commit :
#   oc start-build jingle-quest --from-repo=. --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jingle-quest
  labels: { app: jingle-quest }
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  # Sans ce bloc, le pod de build hérite du défaut du namespace et rampe pendant npm ci / vite build.
  # 1000m : app (1500m) + db (1000m) + build (1000m) = 3,5 cœurs, sous le quota de 4.
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { cpu: 1000m, memory: 1536Mi }
  output:
    to:
      kind: ImageStreamTag
      name: jingle-quest:latest
