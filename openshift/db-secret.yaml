# MODÈLE — ne pas appliquer. Le mot de passe doit être celui de DATABASE_URL (jingle-quest-secrets) :
#   oc create secret generic jingle-quest-db-secret \
#     --from-literal=POSTGRESQL_USER=jq \
#     --from-literal=POSTGRESQL_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=POSTGRESQL_DATABASE=jq
apiVersion: v1
kind: Secret
metadata:
  name: jingle-quest-db-secret
  labels: { app: jingle-quest-db }
type: Opaque
stringData:
  POSTGRESQL_USER: jq
  POSTGRESQL_PASSWORD: 'CHANGEME'
  POSTGRESQL_DATABASE: jq
